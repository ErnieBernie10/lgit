name: Windows add performance probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: go build -o lgit.exe ./cmd/lgit
      - name: Measure small directory adds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'lgit.exe'
          function Invoke-Case([string]$name, [string]$default, [string]$encryption) {
            $root = Join-Path $env:RUNNER_TEMP "lgit-perf-$name"
            $data = Join-Path $env:RUNNER_TEMP "lgit-data-$name"
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $root, $data
            New-Item -ItemType Directory -Force $root, $data | Out-Null
            $env:LGIT_DATA_DIR = $data
            $env:LGIT_PASSWORD = 'benchmark-password'
            & $exe init --root $root --env desktop --default $default --encryption $encryption | Out-Null
            New-Item -ItemType Directory -Force (Join-Path $root 'one'), (Join-Path $root 'two') | Out-Null
            1..5 | ForEach-Object {
              [IO.File]::WriteAllText((Join-Path $root "one/file-$_.txt"), "one $_`n")
              [IO.File]::WriteAllText((Join-Path $root "two/file-$_.txt"), "two $_`n")
            }
            Push-Location $root
            try {
              $first = Measure-Command { & $exe --root $root add one two 2>$null }
              $second = Measure-Command { & $exe --root $root add one two 2>$null }
              Write-Host ("RESULT {0} first_ms={1:N0} unchanged_ms={2:N0}" -f $name, $first.TotalMilliseconds, $second.TotalMilliseconds)
            } finally {
              Pop-Location
            }
          }
          Invoke-Case 'plain' 'plain' 'identity'
          Invoke-Case 'age-identity' 'age' 'identity'
          Invoke-Case 'age-password' 'age' 'password'
