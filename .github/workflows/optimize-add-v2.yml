name: Apply add performance redesign

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Add fast password identity and path walker
        shell: bash
        run: |
          cat > internal/lgit/fast_password.go <<'EOF'
          package lgit

          import (
          	"bytes"
          	"fmt"
          	"os"
          	"path/filepath"

          	"filippo.io/age"
          )

          const wrappedPasswordIdentityRel = ".lgit/password-identity.age"

          type chainedIdentity []age.Identity

          func (ids chainedIdentity) Unwrap(stanzas []*age.Stanza) ([]byte, error) {
          	var last error
          	for _, id := range ids {
          		key, err := id.Unwrap(stanzas)
          		if err == nil {
          			return key, nil
          		}
          		last = err
          	}
          	if last == nil {
          		last = fmt.Errorf("no age identity matched")
          	}
          	return nil, last
          }

          func wrappedPasswordIdentityPath(root string) string {
          	return filepath.Join(root, filepath.FromSlash(wrappedPasswordIdentityRel))
          }

          func hasWrappedPasswordIdentity(root string) bool {
          	_, err := os.Stat(wrappedPasswordIdentityPath(root))
          	return err == nil
          }

          func isScryptAgeCipher(cipher []byte) bool {
          	return bytes.Contains(cipher, []byte("-> scrypt "))
          }

          func (a App) createWrappedPasswordIdentity(root string, confirm bool) (*age.X25519Identity, error) {
          	password, err := a.readPassword(confirm)
          	if err != nil {
          		return nil, err
          	}
          	id, err := age.GenerateX25519Identity()
          	if err != nil {
          		return nil, err
          	}
          	scryptRecipient, err := age.NewScryptRecipient(password)
          	if err != nil {
          		return nil, err
          	}
          	wrapped, err := encryptBytes([]byte(id.String()+"\n"), []age.Recipient{scryptRecipient})
          	if err != nil {
          		return nil, err
          	}
          	if err := os.MkdirAll(filepath.Join(root, ".lgit"), 0700); err != nil {
          		return nil, err
          	}
          	if err := os.WriteFile(wrappedPasswordIdentityPath(root), wrapped, 0600); err != nil {
          		return nil, err
          	}
          	if err := os.WriteFile(filepath.Join(root, ".lgit", "recipients.txt"), []byte(id.Recipient().String()+"\n"), 0600); err != nil {
          		return nil, err
          	}
          	return id, nil
          }

          // loadWrappedPasswordIdentity unlocks the project identity once. The
          // returned chained identity also retains the legacy scrypt identity so
          // repositories can gradually migrate old per-file password ciphertext.
          func (a App) loadWrappedPasswordIdentity(root string) (age.Identity, error) {
          	password, err := a.readPassword(false)
          	if err != nil {
          		return nil, err
          	}
          	scryptIdentity, err := age.NewScryptIdentity(password)
          	if err != nil {
          		return nil, err
          	}
          	wrapped, err := os.ReadFile(wrappedPasswordIdentityPath(root))
          	if err != nil {
          		return nil, err
          	}
          	plain, err := decryptBytes(wrapped, scryptIdentity)
          	if err != nil {
          		return nil, fmt.Errorf("unlock password identity: %w", err)
          	}
          	xid, err := age.ParseX25519Identity(string(bytes.TrimSpace(plain)))
          	if err != nil {
          		return nil, err
          	}
          	return chainedIdentity{xid, scryptIdentity}, nil
          }

          // ensureWrappedPasswordIdentity upgrades legacy password repositories
          // lazily. It stages only encryption metadata; selected age files are
          // converted to X25519 storage by the normal add operation.
          func (a App) ensureWrappedPasswordIdentity(root string, p Project, c StorageConfig) error {
          	if c.Encryption.Mode != "password" || hasWrappedPasswordIdentity(root) {
          		return nil
          	}
          	if _, err := a.createWrappedPasswordIdentity(root, false); err != nil {
          		return err
          	}
          	return a.runPathBatches(root, p.GitDir, []string{"add", "--force", "--"}, []string{wrappedPasswordIdentityRel, ".lgit/recipients.txt"})
          }
          EOF

          cat > internal/lgit/walk_fast.go <<'EOF'
          package lgit

          import (
          	"fmt"
          	"os"
          	"path/filepath"
          	"sort"
          )

          func (a App) nestedRootBoundaries(root string) ([]string, error) {
          	r, err := a.registry()
          	if err != nil {
          		return nil, err
          	}
          	canonicalRoot, err := canonicalPath(root)
          	if err != nil {
          		return nil, err
          	}
          	var boundaries []string
          	for candidate := range r.Projects {
          		c, err := canonicalPath(candidate)
          		if err != nil || pathKey(c) == pathKey(canonicalRoot) {
          			continue
          		}
          		if containsPath(canonicalRoot, c) {
          			boundaries = append(boundaries, c)
          		}
          	}
          	sort.Slice(boundaries, func(i, j int) bool { return len(boundaries[i]) > len(boundaries[j]) })
          	return boundaries, nil
          }

          func containingBoundary(boundaries []string, path string) (string, bool) {
          	for _, boundary := range boundaries {
          		if containsPath(boundary, path) {
          			return boundary, true
          		}
          	}
          	return "", false
          }

          func exactBoundary(boundaries []string, path string) bool {
          	key := pathKey(path)
          	for _, boundary := range boundaries {
          		if pathKey(boundary) == key {
          			return true
          		}
          	}
          	return false
          }

          // expandPathsFast performs one registry/canonicalization pass per add
          // command. In particular, it never reloads the registry or resolves
          // symlinks once per visited directory.
          func (a App) expandPathsFast(root string, p Project, args []string) ([]string, error) {
          	boundaries, err := a.nestedRootBoundaries(root)
          	if err != nil {
          		return nil, err
          	}
          	seen := map[string]bool{}
          	var out []string
          	add := func(rel string) error {
          		rel, err := normalizeLogical(rel)
          		if err != nil {
          			return err
          		}
          		if !seen[rel] {
          			seen[rel] = true
          			out = append(out, rel)
          		}
          		return nil
          	}

          	for _, raw := range args {
          		abs := raw
          		if !filepath.IsAbs(abs) {
          			abs = filepath.Join(root, raw)
          		}
          		abs, err = canonicalPath(abs)
          		if err != nil {
          			return nil, err
          		}
          		if !containsPath(root, abs) {
          			return nil, fmt.Errorf("path outside lgit root: %s", raw)
          		}
          		if child, ok := containingBoundary(boundaries, abs); ok {
          			return nil, fmt.Errorf("path belongs to nested lgit project: %s", child)
          		}
          		if nested, ok := nestedGitRoot(root, abs); ok {
          			return nil, fmt.Errorf("path belongs to nested Git repository: %s", nested)
          		}
          		info, err := os.Lstat(abs)
          		if os.IsNotExist(err) {
          			rel, _ := filepath.Rel(root, abs)
          			if err := add(rel); err != nil {
          				return nil, err
          			}
          			continue
          		}
          		if err != nil {
          			return nil, err
          		}
          		if !info.IsDir() {
          			if info.Mode()&os.ModeSymlink != 0 {
          				return nil, fmt.Errorf("symlink storage is not supported yet: %s", raw)
          			}
          			rel, _ := filepath.Rel(root, abs)
          			if err := add(rel); err != nil {
          				return nil, err
          			}
          			continue
          		}

          		err = filepath.WalkDir(abs, func(path string, d os.DirEntry, walkErr error) error {
          			if walkErr != nil {
          				return walkErr
          			}
          			if path == abs {
          				return nil
          			}
          			if d.IsDir() {
          				if d.Name() == ".git" || d.Name() == ".lgit" || exactBoundary(boundaries, path) {
          					return filepath.SkipDir
          				}
          				if _, err := os.Stat(filepath.Join(path, ".git")); err == nil {
          					return filepath.SkipDir
          				}
          				return nil
          			}
          			if d.Type()&os.ModeSymlink != 0 || !d.Type().IsRegular() {
          				return nil
          			}
          			rel, _ := filepath.Rel(root, path)
          			return add(rel)
          		})
          		if err != nil {
          			return nil, err
          		}
          	}
          	sort.Strings(out)
          	return out, nil
          }
          EOF

          cat > internal/lgit/batch_add.go <<'EOF'
          package lgit

          import (
          	"bytes"
          	"fmt"
          	"os"
          	"os/exec"
          	"path/filepath"
          	"strings"

          	"filippo.io/age"
          )

          const gitPathBatchBudget = 12 * 1024

          func splitPathBatches(paths []string, baseArgs []string) [][]string {
          	if len(paths) == 0 {
          		return nil
          	}
          	baseLen := 0
          	for _, arg := range baseArgs {
          		baseLen += len(arg) + 3
          	}
          	var batches [][]string
          	batch := make([]string, 0, 128)
          	size := baseLen
          	for _, path := range paths {
          		cost := len(path) + 3
          		if len(batch) > 0 && size+cost > gitPathBatchBudget {
          			batches = append(batches, batch)
          			batch = make([]string, 0, 128)
          			size = baseLen
          		}
          		batch = append(batch, path)
          		size += cost
          	}
          	if len(batch) > 0 {
          		batches = append(batches, batch)
          	}
          	return batches
          }

          func (a App) runPathBatches(root, gitDir string, baseArgs, paths []string) error {
          	for _, batch := range splitPathBatches(paths, baseArgs) {
          		args := append(append([]string{}, baseArgs...), batch...)
          		if code := a.run(root, gitDir, args...); code != 0 {
          			return fmt.Errorf("git %s failed", strings.Join(baseArgs, " "))
          		}
          	}
          	return nil
          }

          func mainTrackedSet(root string, standalone bool) (map[string]struct{}, error) {
          	tracked := map[string]struct{}{}
          	if standalone {
          		return tracked, nil
          	}
          	cmd := exec.Command("git", "-C", root, "ls-files", "-z")
          	out, err := cmd.Output()
          	if err != nil {
          		return nil, err
          	}
          	for _, raw := range strings.Split(string(out), "\x00") {
          		if raw != "" {
          			tracked[filepath.ToSlash(raw)] = struct{}{}
          		}
          	}
          	return tracked, nil
          }

          func (a App) mixedAddOptimized(root string, p Project, c StorageConfig, paths []string) error {
          	mainTracked, err := mainTrackedSet(root, p.Standalone)
          	if err != nil {
          		return err
          	}

          	var plainAdd, plainRemove, agePaths []string
          	for _, path := range paths {
          		backend, _ := configuredBackend(c, path)
          		if backend == StorageAge {
          			agePaths = append(agePaths, path)
          			continue
          		}
          		if _, owned := mainTracked[path]; owned {
          			return fmt.Errorf("main repository already tracks %s", path)
          		}
          		full := filepath.Join(root, filepath.FromSlash(path))
          		info, statErr := os.Lstat(full)
          		sp := filepath.ToSlash(storePath(path))
          		switch {
          		case statErr == nil:
          			if !info.Mode().IsRegular() {
          				return fmt.Errorf("only regular files are supported: %s", path)
          			}
          			plainAdd = append(plainAdd, path)
          			plainRemove = append(plainRemove, sp)
          			_ = os.Remove(filepath.Join(root, filepath.FromSlash(sp)))
          		case os.IsNotExist(statErr):
          			plainRemove = append(plainRemove, path, sp)
          			_ = os.Remove(filepath.Join(root, filepath.FromSlash(sp)))
          		default:
          			return statErr
          		}
          	}

          	if err := a.runPathBatches(root, p.GitDir, []string{"add", "--force", "--"}, plainAdd); err != nil {
          		return err
          	}
          	if err := a.runPathBatches(root, p.GitDir, []string{"rm", "--cached", "--ignore-unmatch", "--"}, plainRemove); err != nil {
          		return err
          	}
          	if len(agePaths) == 0 {
          		return nil
          	}

          	if err := a.ensureWrappedPasswordIdentity(root, p, c); err != nil {
          		return err
          	}
          	recipients, err := a.storageRecipients(root, c)
          	if err != nil {
          		return err
          	}
          	wrappedPassword := c.Encryption.Mode == "password" && hasWrappedPasswordIdentity(root)
          	var identity age.Identity
          	var ageAdd, ageRemove []string

          	for _, path := range agePaths {
          		if _, owned := mainTracked[path]; owned {
          			return fmt.Errorf("main repository already tracks %s", path)
          		}
          		full := filepath.Join(root, filepath.FromSlash(path))
          		info, statErr := os.Lstat(full)
          		sp := filepath.ToSlash(storePath(path))
          		if os.IsNotExist(statErr) {
          			_ = os.Remove(filepath.Join(root, filepath.FromSlash(sp)))
          			ageRemove = append(ageRemove, path, sp)
          			continue
          		}
          		if statErr != nil {
          			return statErr
          		}
          		if !info.Mode().IsRegular() {
          			return fmt.Errorf("only regular files are supported: %s", path)
          		}
          		plain, err := os.ReadFile(full)
          		if err != nil {
          			return err
          		}

          		if cipher, err := gitBlob(root, p.GitDir, ":"+sp); err == nil {
          			// Old password ciphertext used an expensive scrypt recipient per
          			// file. Once the wrapped project key exists, lgit add can migrate
          			// the selected path directly from its plaintext worktree contents.
          			if !(wrappedPassword && isScryptAgeCipher(cipher)) {
          				if identity == nil {
          					identity, err = a.storageIdentity(root, c)
          					if err != nil {
          						return err
          					}
          				}
          				old, err := decryptBytes(cipher, identity)
          				if err != nil {
          					return fmt.Errorf("decrypt staged %s: %w", path, err)
          				}
          				if bytes.Equal(old, plain) {
          					continue
          				}
          			}
          		}

          		cipher, err := encryptBytes(plain, recipients)
          		if err != nil {
          			return err
          		}
          		dst := filepath.Join(root, filepath.FromSlash(sp))
          		if err := os.MkdirAll(filepath.Dir(dst), 0700); err != nil {
          			return err
          		}
          		if err := os.WriteFile(dst, cipher, 0600); err != nil {
          			return err
          		}
          		ageAdd = append(ageAdd, sp)
          		ageRemove = append(ageRemove, path)
          	}

          	if err := a.runPathBatches(root, p.GitDir, []string{"add", "--force", "--"}, ageAdd); err != nil {
          		return err
          	}
          	return a.runPathBatches(root, p.GitDir, []string{"rm", "--cached", "--ignore-unmatch", "--"}, ageRemove)
          }
          EOF

      - name: Patch storage policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/lgit/storage_policy.go')
          s = p.read_text()

          old = '''\tif encryption == "password" {
          \t\tif _, err := a.readPassword(true); err != nil {
          \t\t\treturn err
          \t\t}
          \t} else {
          '''
          new = '''\tif encryption == "password" {
          \t\tif _, err := a.createWrappedPasswordIdentity(root, true); err != nil {
          \t\t\treturn err
          \t\t}
          \t} else {
          '''
          if old not in s: raise SystemExit('init password block not found')
          s = s.replace(old, new, 1)

          old = '''\tfiles := []string{".lgit/storage.toml"}
          \tif encryption == "identity" {
          \t\tfiles = append(files, ".lgit/recipients.txt")
          \t}
          '''
          new = '''\tfiles := []string{".lgit/storage.toml", ".lgit/recipients.txt"}
          \tif encryption == "password" {
          \t\tfiles = append(files, wrappedPasswordIdentityRel)
          \t}
          '''
          if old not in s: raise SystemExit('metadata block not found')
          s = s.replace(old, new, 1)

          old = '''\tif c.Encryption.Mode == "password" {
          \t\tpassword, err := a.readPassword(false)
          \t\tif err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\tr, err := age.NewScryptRecipient(password)
          \t\tif err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\treturn []age.Recipient{r}, nil
          \t}
          \treturn readRecipients(root)
          '''
          new = '''\tif c.Encryption.Mode == "password" {
          \t\tif hasWrappedPasswordIdentity(root) {
          \t\t\treturn readRecipients(root)
          \t\t}
          \t\tpassword, err := a.readPassword(false)
          \t\tif err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\tr, err := age.NewScryptRecipient(password)
          \t\tif err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\treturn []age.Recipient{r}, nil
          \t}
          \treturn readRecipients(root)
          '''
          if old not in s: raise SystemExit('recipient block not found')
          s = s.replace(old, new, 1)

          old = '''\tif c.Encryption.Mode == "password" {
          \t\tpassword, err := a.readPassword(false)
          \t\tif err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\treturn age.NewScryptIdentity(password)
          \t}
          \treturn a.loadIdentity()
          '''
          new = '''\tif c.Encryption.Mode == "password" {
          \t\tif hasWrappedPasswordIdentity(root) {
          \t\t\treturn a.loadWrappedPasswordIdentity(root)
          \t\t}
          \t\tpassword, err := a.readPassword(false)
          \t\tif err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\treturn age.NewScryptIdentity(password)
          \t}
          \treturn a.loadIdentity()
          '''
          if old not in s: raise SystemExit('identity block not found')
          s = s.replace(old, new, 1)

          old = '''\tif len(args) > 0 {
          \t\tfmt.Fprintf(a.Stderr, "lgit: scanning %s\\n", strings.Join(args, ", "))
          \t}
          \tpaths, err := a.expandPaths(root, p, args)
          '''
          new = '''\tpaths, err := a.expandPathsFast(root, p, args)
          '''
          if old not in s: raise SystemExit('mixedAdd scan block not found')
          s = s.replace(old, new, 1)

          old = '''\tif len(paths) >= 100 {
          \t\tfmt.Fprintf(a.Stderr, "lgit: found %d files; staging in batches\\n", len(paths))
          \t}
          '''
          if old not in s: raise SystemExit('mixedAdd progress block not found')
          s = s.replace(old, '', 1)

          # Make storage set use the wrapped password path before encrypting.
          old = '''\t\tvar rs []age.Recipient
          \t\tif backend == StorageAge {
          \t\t\trs, err = a.storageRecipients(root, c)
          '''
          new = '''\t\tvar rs []age.Recipient
          \t\tif backend == StorageAge {
          \t\t\tif err := a.ensureWrappedPasswordIdentity(root, p, c); err != nil {
          \t\t\t\trollback()
          \t\t\t\treturn a.fail(err)
          \t\t\t}
          \t\t\trs, err = a.storageRecipients(root, c)
          '''
          if old not in s: raise SystemExit('setStorage age block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Add regression tests
        shell: bash
        run: |
          cat > internal/lgit/fast_password_test.go <<'EOF'
          package lgit

          import (
          	"bytes"
          	"os"
          	"path/filepath"
          	"strings"
          	"testing"
          )

          func TestPasswordInitUsesWrappedProjectIdentity(t *testing.T) {
          	root := t.TempDir()
          	data := t.TempDir()
          	t.Setenv("LGIT_DATA_DIR", data)
          	t.Setenv("LGIT_PASSWORD", "test-password")
          	appRun(t, App{}, root, "init", "--root", root, "--env", "desktop", "--default", "age", "--encryption", "password")
          	if !hasWrappedPasswordIdentity(root) {
          		t.Fatal("wrapped password identity was not created")
          	}
          	if _, err := os.Stat(filepath.Join(root, ".lgit", "recipients.txt")); err != nil {
          		t.Fatal(err)
          	}
          	if err := os.WriteFile(filepath.Join(root, "secret.txt"), []byte("secret\n"), 0600); err != nil {
          		t.Fatal(err)
          	}
          	appRun(t, App{}, root, "add", "secret.txt")
          	p, err := App{}.lookup(root)
          	if err != nil { t.Fatal(err) }
          	cipher, err := gitBlob(root, p.GitDir, ":.lgit/store/secret.txt.age")
          	if err != nil { t.Fatal(err) }
          	if isScryptAgeCipher(cipher) {
          		t.Fatal("file ciphertext still uses per-file scrypt")
          	}
          	if !bytes.Contains(cipher, []byte("-> X25519 ")) {
          		t.Fatalf("expected X25519 recipient header, got %q", cipher[:min(len(cipher), 160)])
          	}
          }

          func TestAddIsSilentOnSuccess(t *testing.T) {
          	root := t.TempDir()
          	data := t.TempDir()
          	t.Setenv("LGIT_DATA_DIR", data)
          	appRun(t, App{}, root, "init", "--root", root, "--env", "desktop", "--default", "plain")
          	if err := os.MkdirAll(filepath.Join(root, "one"), 0700); err != nil { t.Fatal(err) }
          	if err := os.WriteFile(filepath.Join(root, "one", "a.txt"), []byte("a"), 0600); err != nil { t.Fatal(err) }
          	var out, stderr bytes.Buffer
          	app := App{Stdout: &out, Stderr: &stderr}
          	if code := app.Run(root, []string{"--root", root, "add", "one"}); code != 0 {
          		t.Fatalf("add failed: %s", stderr.String())
          	}
          	if strings.TrimSpace(out.String()) != "" || strings.TrimSpace(stderr.String()) != "" {
          		t.Fatalf("successful add should be silent, stdout=%q stderr=%q", out.String(), stderr.String())
          	}
          }
          EOF

      - run: gofmt -w internal/lgit/fast_password.go internal/lgit/walk_fast.go internal/lgit/batch_add.go internal/lgit/storage_policy.go internal/lgit/fast_password_test.go
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/lgit
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Arne Boedt"
          git config user.email "30663198+ErnieBernie10@users.noreply.github.com"
          git add internal/lgit/fast_password.go internal/lgit/walk_fast.go internal/lgit/batch_add.go internal/lgit/storage_policy.go internal/lgit/fast_password_test.go
          git commit -m "perf: redesign add encryption hot path"
          git push
