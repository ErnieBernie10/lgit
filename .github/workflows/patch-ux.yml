name: Patch UX

on:
  push:
    branches:
      - 'ux/attach-preflight'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/attach-preflight
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Patch and verify
        run: |
          python3 scripts/patch_ux.py
          gofmt -w internal/lgit/ux.go internal/lgit/ux_test.go internal/lgit/ux_run.go cmd/lgit/main.go
          go test ./...
          go vet ./...
          go build ./cmd/lgit
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/lgit/ux.go internal/lgit/ux_test.go internal/lgit/ux_run.go cmd/lgit/main.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: harden attach preflight'
          git push origin HEAD:ux/attach-preflight
