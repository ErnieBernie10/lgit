name: Apply attach UX integration

on:
  push:
    branches: [ux/attach-preflight]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/attach-preflight
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Integrate UX commands
        shell: bash
        run: |
          if grep -q 'return a.attachUX(root' internal/lgit/app.go; then
            echo 'already integrated'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/lgit/app.go')
          s = p.read_text()
          old = '''\tcase "key":
\t\troot, _ := canonicalPath(cwd)
\t\treturn a.key(root, args[1:])
\tcase "init":
\t\treturn a.initV2(cwd, explicit, args[1:])
\t}'''
          new = '''\tcase "key":
\t\troot, _ := canonicalPath(cwd)
\t\treturn a.keyUX(root, args[1:])
\tcase "info":
\t\treturn a.infoUX(cwd, explicit, args[1:])
\tcase "remote":
\t\tif len(args) > 1 && args[1] == "list" {
\t\t\treturn a.remoteListUX(args[2:])
\t\t}
\t\tif len(args) > 1 && (args[1] == "--help" || args[1] == "-h") {
\t\t\tfmt.Fprintln(a.Stdout, "Usage: lgit remote set URL | lgit remote list [REMOTE] [--json]")
\t\t\treturn 0
\t\t}
\tcase "attach":
\t\tif len(args) > 1 && (args[1] == "--help" || args[1] == "-h") {
\t\t\treturn a.attachHelp()
\t\t}
\tcase "init":
\t\treturn a.initV2(cwd, explicit, args[1:])
\t}'''
          if old not in s:
              raise SystemExit('Run routing anchor not found')
          s = s.replace(old, new, 1)
          old = '''\tcase "attach":
\t\treturn a.attachMixed(root, args[1:])'''
          new = '''\tcase "attach":
\t\treturn a.attachUX(root, args[1:])'''
          if old not in s:
              raise SystemExit('attach routing anchor not found')
          s = s.replace(old, new, 1)
          old = '''  lgit [--root PATH] attach --env NAME [--project KEY] [--keep-local|--use-remote]
  lgit storage show PATH | set PATH plain|age | unset PATH | default [plain|age]
  lgit remote set URL
  lgit env current|branch|list|create NAME|switch NAME
  lgit key generate|show|export FILE|import FILE'''
          new = '''  lgit [--root PATH] attach [REMOTE] --env NAME [--project KEY] [--keep-local|--use-remote] [--dry-run] [--json]
  lgit [--root PATH] info [--json]
  lgit storage show PATH | set PATH plain|age | unset PATH | default [plain|age]
  lgit remote set URL | lgit remote list [REMOTE] [--json]
  lgit env current|branch|list|create NAME|switch NAME
  lgit key generate|show|path|status|export FILE|import FILE'''
          if old not in s:
              raise SystemExit('help anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w internal/lgit/app.go internal/lgit/ux.go internal/lgit/ux_test.go
          go test ./...
          go vet ./...
          go build ./cmd/lgit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/lgit/app.go internal/lgit/ux.go internal/lgit/ux_test.go
          git commit -m 'feat: improve attach usability and preflight'
          git push origin HEAD:ux/attach-preflight
