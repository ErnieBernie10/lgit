name: Apply age encryption

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ hashFiles('scripts/apply_age_encryption.py') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: python scripts/apply_age_encryption.py
      - run: gofmt -w internal/lgit/app.go internal/lgit/age_store.go internal/lgit/age_store_test.go
      - run: go mod tidy
      - run: go test ./...
      - run: go build ./cmd/lgit
      - name: Commit migration
        run: |
          git config user.name "Arne Boedt"
          git config user.email "30663198+ErnieBernie10@users.noreply.github.com"
          git add -A
          git commit -m "feat: encrypt companion files with age"
          git push
