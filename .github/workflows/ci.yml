name: Apply canonical lookup fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: python3 scripts/fix_lookup_canonical.py
      - run: gofmt -w internal/lgit/app.go
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/lgit
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Arne Boedt"
          git config user.email "30663198+ErnieBernie10@users.noreply.github.com"
          git checkout HEAD -- .github/workflows/ci.yml
          git add -A
          git commit -m "fix: canonicalize registry lookup paths"
          git push
