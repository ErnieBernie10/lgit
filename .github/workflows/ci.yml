name: CI

on:
  push:
    branches:
      - feat/sync-command
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sync-command
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - name: Apply integration patch
        run: python3 scripts/apply-sync-integration.py
      - name: Format
        run: gofmt -w internal/lgit/sync.go internal/lgit/sync_test.go internal/lgit/app.go
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/lgit
      - name: Restore normal CI and commit
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              strategy:
                matrix:
                  os: [ubuntu-latest, macos-latest, windows-latest]
              runs-on: ${{ matrix.os }}
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-go@v5
                  with:
                    go-version: '1.26.5'
                - run: go test ./...
                - run: go vet ./...
                - run: go build ./cmd/lgit
          EOF
          rm -f scripts/apply-sync-integration.py scripts/.sync-trigger .github/workflows/sync-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add lgit sync command'
          git push origin HEAD:feat/sync-command
