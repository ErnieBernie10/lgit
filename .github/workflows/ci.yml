name: Apply storage plan

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: python scripts/implement_storage_plan.py
      - run: gofmt -w internal/lgit/*.go
      - run: go mod tidy
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/lgit
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Arne Boedt"
          git config user.email "30663198+ErnieBernie10@users.noreply.github.com"
          git checkout HEAD -- .github/workflows/ci.yml
          git add -A
          git commit -m "feat: add mixed storage backends and standalone roots"
          git push
